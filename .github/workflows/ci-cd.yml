name: CI/CD Docker Deploy

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_to_vercel:
        description: Deploy frontend to Vercel
        required: true
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements-dev.txt

      - name: Run tests
        run: pytest -q apps/api/tests

  build_and_push_api:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: Production
    env:
      IMAGE_NAME: ${{ vars.VULTR_IMAGE_NAME }}
      REGISTRY: ${{ vars.VULTR_REGISTRY }}
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Vultr Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.VULTR_REGISTRY_USERNAME }}
          password: ${{ secrets.VULTR_REGISTRY_PASSWORD }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}

  build_and_push_web:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: Production
    env:
      IMAGE_NAME: ${{ vars.VULTR_IMAGE_NAME }}-web
      REGISTRY: ${{ vars.VULTR_REGISTRY }}
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Vultr Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.VULTR_REGISTRY_USERNAME }}
          password: ${{ secrets.VULTR_REGISTRY_PASSWORD }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ vars.WEB_API_BASE || 'http://207.148.83.4:8004' }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.image_tag }}

  deploy_vultr_vm:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - build_and_push_api
      - build_and_push_web
    runs-on: ubuntu-latest
    environment: Production
    env:
      API_IMAGE_NAME: ${{ vars.VULTR_IMAGE_NAME }}
      WEB_IMAGE_NAME: ${{ vars.VULTR_IMAGE_NAME }}-web
      REGISTRY: ${{ vars.VULTR_REGISTRY }}
      CORS_ALLOW_ORIGINS: ${{ vars.CORS_ALLOW_ORIGINS }}
      API_CONTAINER_NAME: rackupscoreboard-api
      WEB_CONTAINER_NAME: rackupscoreboard-web
      API_PORT: "8004"
      WEB_HOST_PORT: "80"
      WEB_CONTAINER_PORT: "3000"
    steps:
      - name: Deploy on VM over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_IMAGE_NAME: ${{ env.API_IMAGE_NAME }}
          WEB_IMAGE_NAME: ${{ env.WEB_IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.build_and_push_api.outputs.image_tag }}
          REGISTRY: ${{ env.REGISTRY }}
          API_CONTAINER_NAME: ${{ env.API_CONTAINER_NAME }}
          WEB_CONTAINER_NAME: ${{ env.WEB_CONTAINER_NAME }}
          API_PORT: ${{ env.API_PORT }}
          WEB_HOST_PORT: ${{ env.WEB_HOST_PORT }}
          WEB_CONTAINER_PORT: ${{ env.WEB_CONTAINER_PORT }}
          CORS_ALLOW_ORIGINS: ${{ env.CORS_ALLOW_ORIGINS }}
          VULTR_REGISTRY_USERNAME: ${{ secrets.VULTR_REGISTRY_USERNAME }}
          VULTR_REGISTRY_PASSWORD: ${{ secrets.VULTR_REGISTRY_PASSWORD }}
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ vars.VM_PORT || 22 }}
          envs: API_IMAGE_NAME,WEB_IMAGE_NAME,IMAGE_TAG,REGISTRY,CORS_ALLOW_ORIGINS,API_CONTAINER_NAME,WEB_CONTAINER_NAME,API_PORT,WEB_HOST_PORT,WEB_CONTAINER_PORT,VULTR_REGISTRY_USERNAME,VULTR_REGISTRY_PASSWORD
          script: |
            set -euo pipefail

            echo "$VULTR_REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$VULTR_REGISTRY_USERNAME" --password-stdin
            docker pull "$API_IMAGE_NAME:$IMAGE_TAG"
            docker pull "$WEB_IMAGE_NAME:$IMAGE_TAG"

            docker rm -f "$API_CONTAINER_NAME" || true
            docker rm -f "$WEB_CONTAINER_NAME" || true

            docker run -d \
              --name "$API_CONTAINER_NAME" \
              --restart unless-stopped \
              -p "$API_PORT:$API_PORT" \
              -e PORT="$API_PORT" \
              -e CORS_ALLOW_ORIGINS="$CORS_ALLOW_ORIGINS" \
              "$API_IMAGE_NAME:$IMAGE_TAG"

            # docker run -d \
            #   --name "$WEB_CONTAINER_NAME" \
            #   --restart unless-stopped \
            #   -p "$WEB_HOST_PORT:$WEB_CONTAINER_PORT" \
            #   -e PORT="$WEB_CONTAINER_PORT" \
            #   "$WEB_IMAGE_NAME:$IMAGE_TAG"

            prune_image() {
              local image_name="$1"
              docker images "$image_name" --format "{{.Repository}}:{{.Tag}}" \
                | grep -v ":$IMAGE_TAG$" \
                | grep -v ":latest$" \
                | xargs -r docker rmi || true
            }

            prune_image "$API_IMAGE_NAME"
            prune_image "$WEB_IMAGE_NAME"

            docker image prune -f >/dev/null 2>&1 || true

  deploy_vercel:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_vercel
    needs: test
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy frontend to Vercel
        working-directory: apps/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
