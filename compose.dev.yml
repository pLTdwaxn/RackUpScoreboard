services:
  api:
    image: python:3.14-slim
    working_dir: /app
    volumes:
      - ./apps/api:/app
      - api_pip_cache:/root/.cache/pip
    ports:
      - "8004:8004"
    environment:
      ENV: dev
      HOST: 0.0.0.0
      PORT: 8004
      RELOAD: "true"
      STUB_REDIS: "false"
      REDIS_URL: redis://redis:6379/0
      REDIS_KEY_PREFIX: rackup:scoreboard
      CORS_ALLOW_ORIGINS: "*"
    command: >
      sh -c "pip install -r requirements-dev.txt &&
             uvicorn scoreboard.main:app --host 0.0.0.0 --port 8004 --reload"
    depends_on:
      - redis

  web:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: ""
      NEXT_PUBLIC_LOCAL_API_PORT: 8004
      NEXT_PUBLIC_APP_ENV: dev
      ALLOWED_DEV_ORIGINS: 127.0.0.1,localhost,192.168.0.*
    command: >
      sh -c "npm ci &&
             npm run dev -- --hostname 0.0.0.0"
    depends_on:
      - api

  storybook:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - storybook_node_modules:/app/node_modules
      - storybook_cache:/app/node_modules/.cache
    ports:
      - "6006:6006"
    environment:
      STORYBOOK_DISABLE_TELEMETRY: "1"
    command: >
      sh -c "npm ci &&
             npm run storybook -- --host 0.0.0.0"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  api_pip_cache:
  web_node_modules:
  web_next_cache:
  storybook_node_modules:
  storybook_cache:
